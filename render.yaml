services:
  - type: web
    name: science-on-wheels-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci --workspaces=false && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    preDeployCommand: npx prisma migrate deploy
    initialDeployHook: npm run seed:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.1
      - key: PORT
        value: "10000"
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO_DATA
        value: "false"
