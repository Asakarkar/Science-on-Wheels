services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: science-on-wheels-backend
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 so host Nginx / Caddy handles SSL and reverse-proxying
      - "127.0.0.1:5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - PORT=5000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

